name: 'Get secrets'
description: 'Get secrets from Bitwarden/Vaultwarden'

inputs:
  bw-cli-path:
    description: 'Bw cli path'
    required: true
    default: https://github.com/bitwarden/cli/releases/download/v1.22.1/bw-linux-1.22.1.zip
  bw-client-id:
    description: 'Bw client id'
    required: true
  bw-client-secret:
    description: 'Bw client secret'
    required: true
  vault-url:
    description: 'Vaultwarden URL'
    required: true
  vault-master-password:
    description: 'Vault master password'
    required: true
  vault-folders:
    description: 'Folders (comma-separated) with secrets in Vault'
    required: true

runs:
  using: "composite"
  steps:
    - name: Install Bitwarden CLI
      shell: bash
      run: |
        wget -O bw-cli.zip ${{ inputs.bw-cli-path }}
        unzip bw-cli.zip
        rm -rf bw-cli.zip
        chmod +x bw
        ./bw --version

    - name: Login to Bitwarden
      shell: bash
      env:
        BW_CLIENTID: ${{ inputs.bw-client-id }}
        BW_CLIENTSECRET: ${{ inputs.bw-client-secret }}
      run: |
        ./bw config server "${{ inputs.vault-url }}"
        ./bw login --apikey

    - name: Get secrets from Vaultwarden
      shell: bash
      env:
        BW_PASSWORD: ${{ inputs.vault-master-password }}
        VAULT_FOLDERS: ${{ inputs.vault-folders }}
      run: |
        echo "# Unlocking vault..."
        export BW_SESSION=$(./bw unlock --passwordenv BW_PASSWORD --raw)

        IFS=',' read -ra ADDR <<< "$VAULT_FOLDERS"
        for i in "${ADDR[@]}"; do
          echo "# Processing folder: $i"
          ./bw list items --folderid "$i" --session "$BW_SESSION" > "$i.json"
          if [ -s "$i.json" ]; then
            echo "✅ Exported secrets from $i"
          else
            echo "⚠️ No secrets found in $i"
          fi
        done

        ./bw logout || true
        echo "=== JSON files created ==="
        ls -la *.json || echo "❌ No JSON files created"

    - name: Generate secrets files
      shell: python
      run: |
        import json
        import os
        import base64

        folders_name_str = "${{ inputs.vault-folders }}"
        folders_name = folders_name_str.split(',')
        print(f"Folders to process: {folders_name}")

        result = []
        for folder in folders_name:
            file_name = f"{folder}.json"
            if not os.path.exists(file_name):
                print(f"⚠️ Skipping missing file: {file_name}")
                continue
            with open(file_name, 'r') as f:
                content_file = json.load(f)
                content_file = [
                    {"name": str(item["name"]).lower(), "password": item["login"]["password"]}
                    for item in content_file if "login" in item and "password" in item["login"]
                ]
                filtered = [i for i in content_file if not i["name"].endswith("_b64")]
                decoded = [
                    {"name": i["name"].rstrip("_b64"), "password": base64.b64decode(i["password"]).decode()}
                    for i in content_file if i["name"].endswith("_b64")
                ]
                result.extend(filtered + decoded)
            os.remove(file_name)

        for item in result:
            print(f"# Writing {item['name']}.txt")
            with open(f"{item['name']}.txt", "w") as f:
                f.write(item['password'])

    - name: Set secrets in GitHub
      id: set-secrets
      shell: bash
      run: |
        for i in *.txt; do
            [ -f "$i" ] || break
            gh secret set ${i%.txt} < "$i"
        done

    - name: List generated files
      shell: bash
      run: |
        echo "=== Generated files ==="
        ls -la

    - name: Validate secret extraction
      shell: bash
      run: |
        count=$(ls -1 *.txt 2>/dev/null | wc -l)
        if [ "$count" != 0 ]; then 
          echo "✅ Secrets extracted successfully."
        else
          echo "❌ No secrets were extracted."
          exit 1
        fi
