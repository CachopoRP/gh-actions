name: 'Deploy service'
description: 'Deploy service by name'
inputs:
  compose-name:
    description: 'Docker name'
    required: true
  ssh-host:
    description: 'SSH host'
    required: true
  ssh-user:
    description: 'SSH user'
    required: true
  ssh-private-key:
    description: 'SSH private key'
    required: true
  ghcr-user:
    description: 'GitHub user/actor to authenticate against ghcr.io before pulling (optional, needed for private GHCR images)'
    required: false
    default: ''
  ghcr-token:
    description: 'Token to authenticate against ghcr.io (optional, needed for private GHCR images)'
    required: false
    default: ''

runs:
  using: "composite"
  steps:
      - name: Run cleanup command via SSH
        id: ssh-cleanup
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ inputs.ssh-host }}
          username:  ${{ inputs.ssh-user }}
          key: ${{ inputs.ssh-private-key }}
          script: |
            echo "Cleanup"
            sudo docker compose -p ${{ inputs.compose-name }} down
            rm -rf ${{ inputs.compose-name }} || true
            mkdir -p ${{ inputs.compose-name }}

      - name: Generate tarball
        shell: bash
        run: |
          tar -czvf ${{ inputs.compose-name }}.tar.gz *

      - name: Copy using SCP
        uses: srueda99/scp-action@v13
        with:
          port: 22
          host: ${{ inputs.ssh-host }}
          origin: "./${{ inputs.compose-name }}.tar.gz"
          destination: "/home/docker-deploy/${{ inputs.compose-name }}/"
          username: ${{ inputs.ssh-user }}
          key: ${{ inputs.ssh-private-key }}

      - name: Run remote command via SSH
        id: ssh-command
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ inputs.ssh-host }}
          username: ${{ inputs.ssh-user }}
          key: ${{ inputs.ssh-private-key }}
          script: |
            echo "Move to ${{ inputs.compose-name }} directory"
            cd /home/docker-deploy/${{ inputs.compose-name }}
            sudo tar -xzvf ${{ inputs.compose-name }}.tar.gz
            sudo chown -R docker-deploy:docker-deploy .
            if [ -n "${{ inputs.ghcr-token }}" ]; then
              echo "Logging in to ghcr.io"
              echo "${{ inputs.ghcr-token }}" | sudo docker login ghcr.io -u "${{ inputs.ghcr-user }}" --password-stdin
            fi
            echo "Pulling latest images (artifacts)"
            sudo docker compose pull
            echo "Run docker compose up"
            sudo docker compose up -d
